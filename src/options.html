<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>One Click Image Save Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>One Click Image Save</h1>
      </header>

      <form id="options-form">
        <label class="field">
          <span>Target folder</span>
          <input id="target-folder" name="targetFolder" type="text" autocomplete="off" placeholder="Saved Images">
        </label>

        <div class="checkbox-stack">
          <label class="checkbox">
            <input id="domain-subfolder" name="domainSubfolder" type="checkbox">
            <span>Save in a website domain subfolder</span>
          </label>
          <label class="checkbox sub-checkbox">
            <input id="complete-hostname" name="completeHostname" type="checkbox" disabled>
            <span>Use full hostname</span>
          </label>
        </div>

        <fieldset class="field checkbox-group">
          <legend>Filename options</legend>
          <label class="checkbox">
            <input id="prefix-domain" name="prefixDomain" type="checkbox">
            <span>Prefix website domain name</span>
          </label>
          <label class="checkbox">
            <input id="prefix-timestamp" name="prefixTimestamp" type="checkbox">
            <span>Prefix timestamp</span>
          </label>
        </fieldset>

        <fieldset class="field checkbox-group">
          <legend>Misc. options</legend>
          <label class="field">
            <span>Menu access key</span>
            <input id="menu-access-key" name="menuAccessKey" type="text" maxlength="1" autocomplete="off" inputmode="text" placeholder="i">
          </label>

          <label class="checkbox">
            <input id="overwrite-existing" name="overwriteExisting" type="checkbox">
            <span>Overwrite existing files</span>
          </label>

          <label class="checkbox">
            <input id="close-tab" name="closeTab" type="checkbox">
            <span>Close tab after saving</span>
          </label>
        </fieldset>

        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <footer class="page-footer">
        <a href="https://codeberg.org/wollomatic/one-click-image-save" target="_blank" rel="noopener noreferrer">
          Repository
        </a>
        |
        <a href="https://codeberg.org/wollomatic/one-click-image-save/src/branch/main/LICENSE" target="_blank" rel="noopener noreferrer">
          MIT License
        </a>
        |
        <span id="extension-version">version</span>
      </footer>
    </main>

    <script src="options.js"></script>
  </body>
</html>
